<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retell Web Call</title>
  <!-- Retell SDK (UMD build) -->
  <script src="https://cdn.jsdelivr.net/npm/retell-client-js-sdk@latest/dist/index.umd.js"></script>
</head>
<body>
  <button id="start-call">🎤 Start AI Call</button>
  <p id="status">Ready</p>

  <script>
    const statusEl = document.getElementById("status");
    const btn = document.getElementById("start-call");

    btn.addEventListener("click", async () => {
      statusEl.textContent = "Requesting token...";

      try {
        // Call your Make webhook to get access_token + call_id
        const res = await fetch("https://hook.eu2.make.com/1dy0qj9pyop9walnqq7jl25rutn6jd3l", {
          method: "POST"
        });

        const data = await res.json();

        if (!data.access_token) {
          statusEl.textContent = "No token received!";
          return;
        }

        // Start Retell WebClient
        const client = new RetellWebClient();

        client.on("call_started", () => {
          statusEl.textContent = "Call started!";
        });

        client.on("call_ended", () => {
          statusEl.textContent = "Call ended!";
        });

        client.on("error", (err) => {
          console.error(err);
          statusEl.textContent = "Error: " + err.message;
        });

        await client.startCall({
          accessToken: data.access_token,
          sampleRate: 24000
        });

        statusEl.textContent = "Connecting...";
      } catch (err) {
        console.error("Start call failed:", err);
        statusEl.textContent = "Start call failed!";
      }
    });
  </script>
</body>
</html>
