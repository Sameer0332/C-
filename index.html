<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retell Web Call</title>
</head>
<body>
  <button id="start-call">🎤 Start AI Call</button>
  <p id="status">Ready</p>

  <script type="module">
    import { RetellWebClient } from "https://cdn.jsdelivr.net/npm/retell-client-js-sdk@latest/dist/index.js";

    document.addEventListener("DOMContentLoaded", () => {
      const statusEl = document.getElementById("status");
      const btn = document.getElementById("start-call");

      console.log("Page loaded, binding button...");

      btn.addEventListener("click", async () => {
        statusEl.textContent = "Requesting token...";
        console.log("Button clicked, fetching token...");

        try {
          const res = await fetch("https://hook.eu2.make.com/1dy0qj9pyop9walnqq7jl25rutn6jd3l", {
            method: "POST"
          });

          const data = await res.json();
          console.log("Webhook response:", data);

          if (!data.access_token) {
            statusEl.textContent = "No token received!";
            return;
          }

          const client = new RetellWebClient();
          console.log("Retell client initialized:", client);

          client.on("call_started", () => {
            statusEl.textContent = "Call started!";
            console.log("Call started event received");
          });

          client.on("call_ended", () => {
            statusEl.textContent = "Call ended!";
            console.log("Call ended event received");
          });

          client.on("error", (err) => {
            console.error("SDK error:", err);
            statusEl.textContent = "Error: " + err.message;
          });

          await client.startCall({
            accessToken: data.access_token,
            sampleRate: 24000
          });

          statusEl.textContent = "Connecting...";
          console.log("Calling startCall with token...");
        } catch (err) {
          console.error("Start call failed:", err);
          statusEl.textContent = "Start call failed!";
        }
      });
    });
  </script>
</body>
</html>
