<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Retell Web Call</title>

  <!-- 1) UMD EventEmitter polyfill (correct build) -->
  <script src="https://cdn.jsdelivr.net/npm/events@3.3.0/dist/events.umd.min.js"></script>
  <script>
    // expose EventEmitter so libraries that expect a global can see it
    if (window.events && window.events.EventEmitter) {
      window.EventEmitter = window.events.EventEmitter;
    }
  </script>

  <!-- 2) Retell SDK (UMD) -->
  <script src="https://cdn.jsdelivr.net/npm/retell-client-js-sdk@latest/dist/index.umd.js"></script>
</head>
<body>
  <button id="start-call">🎤 Start AI Call</button>
  <p id="status">Ready</p>

  <script>
    const statusEl = document.getElementById("status");
    const btn = document.getElementById("start-call");

    function ensureSdk() {
      if (typeof RetellWebClient !== "function") {
        alert("Retell SDK not loaded. Open Console: if you see 404 for index.umd.js, a CDN or extension blocked it.");
        return false;
      }
      return true;
    }

    btn.addEventListener("click", async () => {
      statusEl.textContent = "Requesting token...";

      try {
        // call your Make.com webhook (returns JSON with { access_token, call_id })
        const res = await fetch("https://hook.eu2.make.com/1dy0qj9pyop9walnqq7jl25rutn6jd3l", {
          method: "POST"
        });
        const data = await res.json();

        if (!data?.access_token) {
          statusEl.textContent = "No token received";
          return;
        }

        if (!ensureSdk()) return;

        const client = new RetellWebClient();

        client.on("call_started", () => (statusEl.textContent = "Call started"));
        client.on("call_ended",   () => (statusEl.textContent = "Call ended"));
        client.on("error", (err) => {
          console.error(err);
          statusEl.textContent = "Error: " + (err?.message || err);
        });

        await client.startCall({
          accessToken: data.access_token,
          sampleRate: 24000
        });

        statusEl.textContent = "Connecting...";
      } catch (err) {
        console.error("Start call failed:", err);
        statusEl.textContent = "Start call failed";
      }
    });
  </script>
</body>
</html>
